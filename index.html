<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <title>Мой Органайзер</title>
  <link rel="stylesheet" href="main.css?v=5">
  <style>
    /* Фикс модального окна */
    .modal {
      display: none !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: rgba(0,0,0,0.5) !important;
      z-index: 9999 !important;
      align-items: flex-end !important;
      justify-content: center !important;
    }

    .modal.active {
      display: flex !important;
    }

    .modal-content {
      background: #ffffff !important;
      border-radius: 20px 20px 0 0 !important;
      padding: 24px 20px !important;
      width: 100% !important;
      max-width: 480px !important;
      max-height: 80vh !important;
      overflow-y: auto !important;
    }

    .modal-content h3 {
      margin-bottom: 16px !important;
      font-size: 18px !important;
      color: #333 !important;
    }

    .modal-content input,
    .modal-content textarea {
      width: 100% !important;
      padding: 12px !important;
      border: 1px solid #ddd !important;
      border-radius: 10px !important;
      margin-bottom: 12px !important;
      font-size: 16px !important;
      font-family: inherit !important;
      background: #fff !important;
      color: #333 !important;
      display: block !important;
    }

    .modal-content input:focus,
    .modal-content textarea:focus {
      outline: none !important;
      border-color: #1a1a2e !important;
    }

    .modal-buttons {
      display: flex !important;
      gap: 10px !important;
      margin-top: 8px !important;
    }

    .btn-primary,
    .btn-secondary {
      flex: 1 !important;
      padding: 12px !important;
      border: none !important;
      border-radius: 10px !important;
      font-size: 16px !important;
      cursor: pointer !important;
      font-weight: 500 !important;
    }

    .btn-primary {
      background: #1a1a2e !important;
      color: #fff !important;
    }

    .btn-secondary {
      background: #f0f0f0 !important;
      color: #333 !important;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="page-title">Мой Органайзер</h1>
  </header>

  <main>
    <div id="savings-page" class="page"></div>
    <div id="car-page" class="page"></div>
    <div id="notes-page" class="page"></div>
  </main>

  <nav id="bottom-nav"></nav>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script src="firebase-config.js?v=5"></script>
  <script src="db.js?v=5"></script>
  <script src="navigation.js?v=5"></script>
  <script src="savings.js?v=5"></script>
  <script src="car.js?v=5"></script>
  <script src="notes.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
